# Netlify: publica la carpeta raíz tal cual y activa las funciones del servidor (pagos con Bold)
[build]
  publish = "."
  functions = "netlify/functions"

# Que no se puedan abrir desde internet los archivos internos (base de datos, funciones, configuración)
[[redirects]]
  from = "/sql/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
